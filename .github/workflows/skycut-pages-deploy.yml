name: Deploy Vexal and SkyCut to GitHub Pages

on:
  push:
    branches: [skycut-rebuild]
    paths:
      - "skycut-workspace/apps/web/**"
      - ".github/workflows/skycut-pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SkyCut source
        uses: actions/checkout@v4
        with:
          ref: skycut-rebuild
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: source/skycut-workspace/apps/web
        run: npm install

      - name: Typecheck
        working-directory: source/skycut-workspace/apps/web
        run: npm run typecheck

      - name: Build SkyCut
        working-directory: source/skycut-workspace/apps/web
        run: npm run build

      - name: Checkout existing Vexal website
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Add SkyCut without replacing Vexal
        run: |
          mkdir -p site/skycut-preview
          cp -a source/skycut-workspace/apps/web/dist/. site/skycut-preview/
          touch site/.nojekyll
          touch site/skycut-preview/.nojekyll

      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
