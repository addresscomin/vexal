name: VYRO Web Preview
on:
  push:
    branches: [main]
    paths:
      - "vyro-preview/**"
      - ".github/workflows/vyro-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: vyro-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: vyro-preview
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
