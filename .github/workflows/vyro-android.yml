name: VYRO Android Build

on:
  push:
    paths:
      - "vyro-android/**"
      - ".github/workflows/vyro-android.yml"
  pull_request:
    paths:
      - "vyro-android/**"
      - ".github/workflows/vyro-android.yml"
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          build-root-directory: vyro-android
          arguments: assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vyro-debug-apk
          path: vyro-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
